spring.datasource.url=jdbc:h2:mem:hsftest;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=true

# src/main/resources/schema.sql starts with "USE SeafoodStoreDB", which is SQL Server specific.
# In tests let Hibernate build the schema from the entities instead of running that script.
spring.sql.init.mode=never

# Dummy external keys, only so the context can start. No outbound calls are made in tests.
gemini.api.key=test-key
payos.apiKey=test-api-key
payos.checksumKey=test-checksum-key
payos.clientId=test-client-id
cloudinary.cloud_name=test
cloudinary.api_key=test
cloudinary.api_secret=test
