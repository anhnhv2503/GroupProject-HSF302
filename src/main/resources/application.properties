spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SeafoodStoreDB;encrypt=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
server.servlet.session.timeout=30m

# Encoding Settings to fix Vietnamese mojibake
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8

# Application base URL, used to build the PayOS returnUrl/cancelUrl.
# Must point at the real domain once deployed, otherwise PayOS sends customers back to localhost.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# How often the expired-order cleanup job runs (ms)
app.order-expiry.interval-ms=${ORDER_EXPIRY_INTERVAL_MS:300000}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model-name=${GEMINI_MODEL_NAME:gemini-2.5-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:15}
gemini.max-retries=${GEMINI_MAX_RETRIES:1}

# PayOS - no defaults here on purpose. Real keys were once committed to this file
# (commit ab1f5ee), so those keys must be treated as leaked and revoked in the PayOS dashboard.
payos.apiKey=${PAYOS_API_KEY}
payos.checksumKey=${PAYOS_CHECKSUM_KEY}
payos.clientId=${PAYOS_CLIENT_ID}

cloudinary.cloud_name=${CLOUD_NAME}
cloudinary.api_key=${API_KEY}
cloudinary.api_secret=${API_SECRET}